apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockflow-hq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockflow-hq
  template:
    metadata:
      labels:
        app: stockflow-hq
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: stockflow-hq
        image: 836533914314.dkr.ecr.ap-northeast-2.amazonaws.com/stockflow-hq:latest
        ports:
        - containerPort: 8082
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: stockflow-secret
              key: DB_URL
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: stockflow-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stockflow-secret
              key: DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: stockflow-secret
              key: JWT_SECRET
        - name: JWT_EXPIRATION
          valueFrom:
            secretKeyRef:
              name: stockflow-secret
              key: JWT_EXPIRATION
        - name: JWT_REFRESH_EXPIRATION
          valueFrom:
            secretKeyRef:
              name: stockflow-secret
              key: JWT_REFRESH_EXPIRATION
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: stockflow-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: stockflow-config
              key: REDIS_HOST
---
apiVersion: v1
kind: Service
metadata:
  name: stockflow-hq-service
spec:
  selector:
    app: stockflow-hq
  type: NodePort
  ports:
  - port: 8082
    targ    targ    targ    tPort: 30082
