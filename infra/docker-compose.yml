services:
  postgres:
    image: postgres:15
    container_name: stockflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stockflow-network

  redis:
    image: redis:7
    container_name: stockflow-redis
    ports:
      - "6379:6379"
    networks:
      - stockflow-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: stockflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - stockflow-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: stockflow-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - stockflow-network

  store-service:
    build:
      context: ../backend
      dockerfile: store-service/Dockerfile
    container_name: stockflow-store
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - stockflow-network

  hq-service:
    build:
      context: ../backend
      dockerfile: hq-service/Dockerfile
    container_name: stockflow-hq
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_SERVICE_BASE_URL: http://ai-service:8000
    depends_on:
      - postgres
      - redis
      - kafka
      - ai-service
    networks:
      - stockflow-network

  ai-service:
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: stockflow-ai
    ports:
      - "8000:8000"
    networks:
      - stockflow-network

networks:
  stockflow-network:
    driver: bridge

volumes:
  postgres-data:
