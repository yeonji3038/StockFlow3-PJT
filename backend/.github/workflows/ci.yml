name: CI - Build and Push to ECR

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 836533914314.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Build store-service and hq-service
      run: ./gradlew :store-service:bootJar :hq-service:bootJar -x test

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - n     Build and push store-service
      run: |
        docker build -t $ECR_REGISTRY/stockflow-store:${{ github.sha }} \
          -f store-service/Dockerfile .
        docker push $ECR_REGISTRY/stockflow-store:${{ github.sha }}
        docker tag $ECR_REGISTRY/stockflow-store:${{ github.sha }} \
          $ECR_REGISTRY/stockflow-store:latest
        docker push $ECR_REGISTRY/stockflow-store:latest

    -    -    -    -    -    -    -    -    -    -    -    docker build -t $ECR_REGISTRY/stockflow-hq:${{ github.sha }} \
          -f hq-service/Dockerfile .
        doc        doc        doc        doc        doc        doc        docer tag $ECR_REGISTRY/stockflow-hq:${{ github.sha }} \
          $ECR_REGISTRY/stockflow-hq:latest
        docker push $ECR_REGISTRY/stockflow-hq:latest
